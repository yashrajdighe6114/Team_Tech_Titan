version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: assettrust-ai
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: assettrust-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8001
      - JWT_SECRET=assettrust-hackathon-secret-jwt-key-2026
    depends_on:
      - ai-service

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: assettrust-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
